<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cooper GYM4SCHOOL">
<link rel="manifest" href="manifest.webmanifest">
<title>Cooper GYM4SCHOOL</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#172033;--muted:#667085;--line:#d7dce3;--accent:#172033;--danger:#b42318;--ok:#027a48;--shadow:0 8px 24px rgba(16,24,40,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100%;overscroll-behavior:none}
body{touch-action:manipulation}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:1200px;margin:0 auto;padding:18px 18px 28px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
.brand{font-weight:800;font-size:clamp(24px,4vw,34px);letter-spacing:-.02em}.subtitle{color:var(--muted);font-size:14px;margin-top:3px}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 14px;border-radius:12px;font-weight:700;box-shadow:0 1px 2px rgba(16,24,40,.04)}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.danger{background:#fff;color:var(--danger);border-color:#f3b4af}.btn.small{padding:8px 10px;font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid #cfd5dd;border-radius:12px;padding:12px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:#111827;box-shadow:0 0 0 3px rgba(17,24,39,.08)}
.students{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.student-row{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center}.num{height:44px;border-radius:12px;background:#eef0f3;display:flex;align-items:center;justify-content:center;font-weight:900}.student-row input{height:44px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.note{color:var(--muted);font-size:13px;line-height:1.4}
.hidden{display:none!important}
#testScreen{min-height:calc(100vh - 40px);display:flex;flex-direction:column}
.test-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;min-height:44px}.test-title{font-weight:800;font-size:18px}.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:clamp(48px,7vw,82px);line-height:1;text-align:center;letter-spacing:-.045em}.test-meta{color:var(--muted);text-align:right;font-size:13px}.menu-wrap{position:relative;justify-self:start}.menu-panel{position:absolute;top:46px;left:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;min-width:230px;z-index:50}.menu-panel button{width:100%;text-align:left;padding:11px 12px;border:0;background:#fff;border-radius:10px;font-weight:750}.menu-panel button:hover{background:#f1f3f5}.menu-panel .danger-item{color:var(--danger)}
.live-grid{flex:1;display:flex;flex-direction:column;gap:20px;min-height:0}.button-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;flex:1;min-height:0}.board-timer{flex:0 0 92px;display:flex;align-items:center;justify-content:center}
.student-card{position:relative;user-select:none;border:8px solid #fff;border-radius:22px;box-shadow:0 0 0 2px rgba(16,24,40,.16),0 8px 20px rgba(16,24,40,.10);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:190px;overflow:hidden;touch-action:manipulation;transition:transform .08s ease,filter .08s ease}.student-card:active{transform:scale(.985)}.student-card.flash{z-index:3;animation:tapPulse 2s ease-out}.student-num{font-size:clamp(54px,9vw,110px);line-height:.9;font-weight:950;text-shadow:0 1px 1px rgba(0,0,0,.12)}.student-name{font-size:clamp(16px,2.3vw,26px);font-weight:850;margin-top:9px;max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.laps{font-size:clamp(16px,2.5vw,28px);font-weight:800;margin-top:8px}.tap-msg{position:absolute;top:10px;right:12px;font-size:14px;font-weight:950;padding:7px 10px;border-radius:999px;background:#fff;opacity:0;transform:translateY(-6px) scale(.9);box-shadow:0 3px 12px rgba(0,0,0,.18);transition:.18s}.student-card.flash .tap-msg{opacity:1;transform:translateY(0) scale(1)}@keyframes tapPulse{0%{transform:scale(.985);filter:brightness(1.45)}10%{transform:scale(1.03);filter:brightness(1.5);box-shadow:0 0 0 6px rgba(255,255,255,.95),0 0 0 13px rgba(17,24,39,.55),0 14px 34px rgba(16,24,40,.28)}35%{transform:scale(1.015);filter:brightness(1.28);box-shadow:0 0 0 5px rgba(255,255,255,.9),0 0 0 11px rgba(17,24,39,.45),0 12px 30px rgba(16,24,40,.22)}70%{transform:scale(1.005);filter:brightness(1.16);box-shadow:0 0 0 4px rgba(255,255,255,.75),0 0 0 8px rgba(17,24,39,.3),0 10px 24px rgba(16,24,40,.16)}100%{transform:scale(1);filter:brightness(1);box-shadow:0 0 0 2px rgba(16,24,40,.16),0 8px 20px rgba(16,24,40,.10)}}
.c1{background:#6ee7b7}.c2{background:#60a5fa}.c3{background:#fde047}.c4{background:#f87171}.c5{background:#fb923c}.c6{background:#c084fc}.c7{background:#f472b6}.c8{background:#67e8f9}
.zero-state{display:flex;align-items:center;justify-content:center;color:var(--muted);padding:20px;text-align:center}
.results h2{margin:0 0 10px}.table-wrap{overflow:auto}.results table{border-collapse:collapse;width:100%;min-width:520px}.results th,.results td{padding:10px 8px;border-bottom:1px solid #e5e7eb;text-align:left}.results th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:999px;box-shadow:var(--shadow);font-weight:700;z-index:100;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:90}.modal{background:#fff;border-radius:18px;max-width:430px;width:100%;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.22)}.modal h3{margin:0 0 8px}.modal p{color:var(--muted);line-height:1.45}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#settingsScreen > .panel:first-of-type{background:#fffbea;border-color:#eadf9a}\n@media (max-width:800px){.app{padding:12px}.grid{grid-template-columns:1fr}.students{grid-template-columns:1fr 1fr}.test-meta{display:none}.live-grid{gap:16px}.button-row{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.board-timer{flex-basis:82px}.student-card{min-height:0}}
@media (max-width:520px){.students{grid-template-columns:1fr}.live-grid{gap:12px}.button-row{gap:14px}.board-timer{flex-basis:70px}.student-card{min-height:0;border-width:7px}.student-name{font-size:16px}.laps{font-size:18px}}
</style>
</head>
<body>
<div class="app" id="settingsScreen">
  <header><div><div class="brand">Cooper GYM4SCHOOL</div><div class="subtitle">Test di resistenza — 1–8 alunni</div></div><div class="header-actions"><button class="btn small" id="historyBtn">STORICO</button></div></header>
  <section class="panel">
    <div class="grid">
      <div class="field"><label for="className">Classe</label><input id="className" placeholder="es. 2ª A"></div>
      <div class="field"><label for="duration">Durata</label><select id="duration"><option value="6">6 minuti</option><option value="9">9 minuti</option><option value="12">12 minuti</option></select></div>
      <div class="field"><label for="circuit">Lunghezza circuito (m)</label><input id="circuit" type="number" min="10" step="10" value="200"></div>
    </div>
    <div class="students" id="studentInputs"></div>
    <div class="actions"><button class="btn primary" id="startBtn">AVVIA PROVA</button><button class="btn" id="clearBtn">PULISCI NOMI</button></div>
    <p class="note" style="margin:14px 0 0">Puoi inserire da 1 a 8 alunni. Le caselle vuote non impediscono l'avvio. Durante la prova ogni alunno registra autonomamente i propri giri toccando il proprio riquadro.</p>
  </section>
  <section class="panel results hidden" id="historyPanel"><h2>Storico prove</h2><div id="historyContent"></div></section>
</div>

<div class="app hidden" id="testScreen">
  <div class="test-top">
    <div class="menu-wrap">
      <button class="btn small" id="menuBtn">MENU ▾</button>
      <div class="menu-panel hidden" id="menuPanel">
        <button id="fullscreenBtn">SCHERMO INTERO</button>
        <button id="restartBtn">RICOMINCIA</button>
        <button id="settingsFromTest">TORNA A IMPOSTAZIONI</button>
        <button class="danger-item" id="stopBtn">STOP</button>
      </div>
    </div>
    <div class="test-meta" id="testMeta"></div>
  </div>
  <div class="live-grid" id="liveGrid"></div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-backdrop hidden" id="modalBackdrop"><div class="modal"><h3 id="modalTitle">Conferma</h3><p id="modalText"></p><div class="modal-actions"><button class="btn" id="modalCancel">ANNULLA</button><button class="btn danger" id="modalConfirm">CONFERMA</button></div></div></div>
<script>
const DB_NAME='cooper-gym4school-db', DB_VERSION=1;
let db=null, activeSession=null, timerHandle=null, saveChain=Promise.resolve(), menuOpen=false;
const $=id=>document.getElementById(id);
const studentColors=['c1','c2','c3','c4','c5','c6','c7','c8'];
const defaultNames=Array.from({length:8},()=>({name:'',laps:0,lastTap:0}));
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('history'))d.createObjectStore('history',{keyPath:'id',autoIncrement:true});};r.onsuccess=()=>{db=r.result;resolve(db)};r.onerror=()=>reject(r.error)});} 
function dbPut(store,key,value){return new Promise((res,rej)=>{const t=db.transaction(store,'readwrite');const s=t.objectStore(store);const r=key===undefined?s.add(value):s.put(value,key);let result;r.onsuccess=()=>{result=r.result};r.onerror=()=>rej(r.error);t.oncomplete=()=>res(result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('IndexedDB transaction aborted'))})}
function dbGet(store,key){return new Promise((res,rej)=>{const t=db.transaction(store,'readonly');const r=t.objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function dbAll(store){return new Promise((res,rej)=>{const t=db.transaction(store,'readonly');const r=t.objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function dbDelete(store,key){return new Promise((res,rej)=>{const t=db.transaction(store,'readwrite');const r=t.objectStore(store).delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function dbClear(store){return new Promise((res,rej)=>{const t=db.transaction(store,'readwrite');const r=t.objectStore(store).clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function buildHistoryRecord(session){
  return {
    sessionId:session.sessionId,
    timestamp:session.startAt,
    completedAt:session.completedAt||null,
    status:session.finished ? (session.finishReason==='auto'?'completed':'interrupted') : 'in_progress',
    className:session.className,
    duration:session.duration,
    circuit:session.circuit,
    students:session.students.map(s=>({n:s.n,name:s.name,laps:s.laps,meters:s.laps*session.circuit}))
  };
}
async function getHistoryList(){
  return (await dbGet('kv','historyList'))||[];
}
async function saveHistoryRecord(record){
  const list=await getHistoryList();
  const index=list.findIndex(x=>x.sessionId===record.sessionId);
  if(index>=0)list[index]=record;else list.unshift(record);
  await dbPut('kv','historyList',list.slice(0,100));
}
async function queueHistorySnapshot(session){
  const record=buildHistoryRecord(session);
  await saveHistoryRecord(record);
}
function queueSave(){
  saveChain=saveChain.then(async()=>{
    if(!activeSession)return;
    const snapshot=structuredClone(activeSession);
    await dbPut('kv','activeSession',snapshot);
    await queueHistorySnapshot(snapshot);
  }).catch(e=>{console.error(e);showToast('Salvataggio locale mantenuto');});
  return saveChain;
}
function fmtTime(ms){const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>t.classList.remove('show'),1600)}
let audioCtx=null;
function playTapSound(n=1){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();const freqs=[523.25,587.33,659.25,698.46,783.99,880,987.77,1046.5];const base=freqs[Math.max(0,Math.min(7,n-1))];const o=audioCtx.createOscillator();const g=audioCtx.createGain();const now=audioCtx.currentTime;o.type='square';o.frequency.setValueAtTime(base,now);o.frequency.exponentialRampToValueAtTime(base*.75,now+.11);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.28,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+.15);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.16);}catch(e){}}
function showConfirm(title,text,onConfirm){$('modalTitle').textContent=title;$('modalText').textContent=text;$('modalBackdrop').classList.remove('hidden');const yes=$('modalConfirm');const no=$('modalCancel');const cleanup=()=>{$('modalBackdrop').classList.add('hidden');yes.onclick=null;no.onclick=null};no.onclick=cleanup;yes.onclick=()=>{cleanup();onConfirm()}}
function renderInputs(names){const box=$('studentInputs');box.innerHTML='';for(let i=0;i<8;i++){const row=document.createElement('div');row.className='student-row';row.innerHTML='<div class="num">'+(i+1)+'</div><input data-idx="'+i+'" placeholder="Nome alunno '+(i+1)+'" value="'+escapeHtml(names[i]?.name||'')+'">';box.appendChild(row)}}
function currentStudents(){return [...document.querySelectorAll('#studentInputs input')].map((el,i)=>({n:i+1,name:el.value.trim(),laps:0,lastTap:0,rapidIgnored:0,tapGuardUntil:0})).filter(x=>x.name)}
function renderHistory(items){
  const c=$('historyContent');
  if(!items.length){
    c.innerHTML='<div class="zero-state">Nessuna prova salvata.</div>';
    return;
  }
  items.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
  let html='<div class="actions" style="margin-top:0;margin-bottom:14px"><button class="btn small" id="exportCsv">ESPORTA CSV</button><button class="btn small danger" id="clearHistory">CANCELLA STORICO</button></div>';
  for(const x of items){
    const status=({completed:'Completata',interrupted:'Interrotta',in_progress:'In corso'}[x.status]||'Salvata');
    const ranking=(x.students||[]).map(s=>({
      ...s,
      laps:Number(s.laps||0),
      meters:Number(s.meters||((s.laps||0)*(x.circuit||0)))
    })).sort((a,b)=>b.meters-a.meters || b.laps-a.laps || a.n-b.n);

    html+='<div class="panel history-report" data-session-id="'+escapeHtml(x.sessionId||'')+'" style="margin-bottom:14px;padding:14px">';
    html+='<div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px"><button class="btn small" data-export-session="'+escapeHtml(x.sessionId||'')+'">ESPORTA CSV</button><button class="btn small danger" data-delete-session="'+escapeHtml(x.sessionId||'')+'">ELIMINA</button></div>';
    html+='<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap"><button class="btn small danger" data-delete-session="'+escapeHtml(x.sessionId||'')+'">ELIMINA</button>';
    html+='<div><strong>'+new Date(x.timestamp||Date.now()).toLocaleString('it-IT')+'</strong><div class="note">'+escapeHtml(x.className||'Classe non indicata')+' · '+x.duration+' min · circuito '+x.circuit+' m</div></div>';
    html+='<div><strong>'+status+'</strong></div></div>';

    html+='<div style="margin-top:16px"><h3 style="margin:0 0 10px">CLASSIFICA — dal più veloce al meno veloce</h3>';
    html+='<div class="table-wrap"><table><thead><tr><th>Pos.</th><th>N.</th><th>Alunno</th><th>Giri</th><th>Metri</th></tr></thead><tbody>';
    ranking.forEach((s,idx)=>{
      html+='<tr><td><strong>'+(idx+1)+'</strong></td><td>'+s.n+'</td><td>'+escapeHtml(s.name||'')+'</td><td><strong>'+s.laps+'</strong></td><td><strong>'+s.meters+' m</strong></td></tr>';
    });
    html+='</tbody></table></div>';
    html+='<div class="note" style="margin-top:8px">Classifica ordinata per <strong>metri percorsi</strong>; a parità di metri prevalgono i giri.</div></div>';

    html+='<details style="margin-top:12px"><summary>Dettaglio prova</summary>';
    html+='<div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>N.</th><th>Alunno</th><th>Giri</th><th>Metri</th></tr></thead><tbody>';
    ranking.forEach(s=>{
      html+='<tr><td>'+s.n+'</td><td>'+escapeHtml(s.name||'')+'</td><td>'+s.laps+'</td><td>'+s.meters+' m</td></tr>';
    });
    html+='</tbody></table></div></details>';
    const totalMeters=ranking.reduce((sum,s)=>sum+s.meters,0);
    html+='<div class="note" style="margin-top:8px">Metri complessivi registrati: <strong>'+totalMeters+' m</strong></div>';
    html+='</div>';
  }
  c.innerHTML=html;
  $('exportCsv').onclick=()=>exportCSV(items);
  $('clearHistory').onclick=()=>{
    showConfirm('ATTENZIONE','Stai per cancellare TUTTO lo storico. Vuoi continuare?',()=>{
      showConfirm('CONFERMA FINALE','Questa operazione cancellerà definitivamente tutte le prove salvate. Sei davvero sicuro?',async()=>{
        await dbPut('kv','historyList',[]);
        renderHistory([]);
        showToast('Storico cancellato');
      });
    });
  };
  document.querySelectorAll('[data-export-session]').forEach(btn=>{
    btn.onclick=()=>{
      const sessionId=btn.dataset.exportSession;
      const record=items.find(x=>x.sessionId===sessionId);
      if(record)exportCSV([record]);
    };
  });
  document.querySelectorAll('[data-delete-session]').forEach(btn=>{
    btn.onclick=()=>{
      const sessionId=btn.dataset.deleteSession;
      showConfirm('Elimina prova','Vuoi eliminare solo questa prova dallo storico?',async()=>{
        const list=await getHistoryList();
        await dbPut('kv','historyList',list.filter(x=>x.sessionId!==sessionId));
        renderHistory(await getHistoryList());
        showToast('Prova eliminata');
      });
    };
  });
}
function exportCSV(items){const rows=[['data','classe','durata_min','circuito_m','numero','alunno','giri','metri']];for(const x of items){for(const s of x.students)rows.push([new Date(x.timestamp).toISOString(),x.className,x.duration,x.circuit,s.n,s.name,s.laps,s.laps*x.circuit])}const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cooper-gym4school.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function showHistory(){const p=$('historyPanel');p.classList.remove('hidden');try{renderHistory(await getHistoryList());p.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){console.error(e);$('historyContent').innerHTML='<div class="zero-state">Errore nella lettura dello storico.</div>'}}
function buildLive(){const g=$('liveGrid');g.innerHTML='';const top=document.createElement('div');top.className='button-row';const timerBox=document.createElement('div');timerBox.className='board-timer';timerBox.innerHTML='<div class="timer" id="timer">00:00</div>';const bottom=document.createElement('div');bottom.className='button-row';activeSession.students.forEach((s,i)=>{const card=document.createElement('button');card.type='button';card.className='student-card '+studentColors[s.n-1];card.dataset.n=s.n;card.innerHTML='<div class="student-num">'+s.n+'</div><div class="student-name">'+escapeHtml(s.name)+'</div><div class="laps">GIRI <span class="lap-count">'+s.laps+'</span></div><div class="tap-msg">+1 GIRO</div>';card.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();registerLap(s.n,card)}, {passive:false});(i<4?top:bottom).appendChild(card)});g.append(top,timerBox,bottom)}
function registerLap(n,card){if(!activeSession||activeSession.finished)return;const s=activeSession.students.find(x=>x.n===n);if(!s)return;const now=performance.now();if(s.tapGuardUntil&&now<s.tapGuardUntil){if((s.rapidIgnored||0)>0)s.rapidIgnored--;return}s.tapGuardUntil=now+1500;s.rapidIgnored=2;s.lastTap=now;s.laps++;card.querySelector('.lap-count').textContent=s.laps;card.classList.remove('flash');void card.offsetWidth;card.classList.add('flash');playTapSound(n);setTimeout(()=>card.classList.remove('flash'),2050);queueSave()}
function updateTimer(){if(!activeSession)return;const remain=activeSession.endAt-Date.now();$('timer').textContent=fmtTime(remain);if(remain<=0)finishTest('auto')}
async function finishTest(reason){
  if(!activeSession||activeSession.finished)return;
  await saveChain;
  const session=structuredClone(activeSession);
  session.finished=true;
  session.finishReason=reason;
  session.completedAt=Date.now();
  clearInterval(timerHandle);timerHandle=null;
  try{
    await dbPut('kv','activeSession',session);
    await saveHistoryRecord(buildHistoryRecord(session));
    await dbDelete('kv','activeSession');
    activeSession=session;
    showToast(reason==='auto'?'Tempo scaduto. Risultati salvati.':'Prova interrotta. Risultati salvati.');
    setTimeout(()=>showSettings(),500);
  }catch(e){
    console.error(e);
    await dbPut('kv','activeSession',session);
    showToast('Errore di salvataggio: la prova è stata mantenuta per il recupero.');
  }
}
function showSettings(){clearInterval(timerHandle);timerHandle=null;activeSession=null;$('testScreen').classList.add('hidden');$('settingsScreen').classList.remove('hidden');loadHistoryPanel();closeMenu()}
async function loadHistoryPanel(){if(!$('historyPanel').classList.contains('hidden'))renderHistory(await getHistoryList())}
async function startTest(){
  const students=currentStudents();
  if(!students.length){showToast('Inserisci almeno un alunno');return}
  const duration=Number($('duration').value);
  const circuit=Number($('circuit').value);
  if(!circuit||circuit<10){showToast('Inserisci la lunghezza del circuito');return}
  const now=Date.now();
  activeSession={version:1,sessionId:String(now)+'-'+Math.random().toString(36).slice(2,8),className:$('className').value.trim(),duration,circuit,students,startAt:now,endAt:now+duration*60000,finished:false,finishReason:null};
  try{
    await saveHistoryRecord(buildHistoryRecord(activeSession));
    await dbPut('kv','activeSession',structuredClone(activeSession));
  }catch(e){
    console.error(e);
    activeSession=null;
    showToast('Impossibile creare lo storico. Riprova.');
    return;
  }
  $('settingsScreen').classList.add('hidden');$('testScreen').classList.remove('hidden');
  $('testMeta').textContent=(activeSession.className?activeSession.className+' · ':'')+circuit+' m';
  buildLive();$('timer').textContent=fmtTime(duration*60000);
  clearInterval(timerHandle);timerHandle=setInterval(updateTimer,200);updateTimer();closeMenu();
}
function toggleMenu(){menuOpen=!menuOpen;$('menuPanel').classList.toggle('hidden',!menuOpen)}
function closeMenu(){menuOpen=false;$('menuPanel').classList.add('hidden')}
async function restartTest(){
  closeMenu();
  if(!activeSession||activeSession.finished)return;
  showConfirm('Ricomincia prova','Tutti i giri registrati verranno azzerati e il timer ripartirà da  zero. Vuoi ricominciare?',async()=>{
    activeSession.startAt=Date.now();
    activeSession.endAt=Date.now()+activeSession.duration*60000;
    activeSession.finished=false;
    activeSession.students.forEach(s=>{s.laps=0;s.lastTap=0;s.rapidIgnored=0;s.tapGuardUntil=0});
    await dbPut('kv','activeSession',structuredClone(activeSession));
    buildLive();
    $('timer').textContent=fmtTime(activeSession.duration*60000);
    clearInterval(timerHandle);
    timerHandle=setInterval(updateTimer,200);
    updateTimer();
    showToast('Prova ricominciata');
  });
}
async function returnToSettings(){showConfirm('Torna a impostazioni','La prova verrà fermata e il risultato parziale verrà salvato nello storico. Continuare?',()=>finishTest('manual-settings'))}
async function stopTest(){showConfirm('STOP','La prova verrà fermata e il risultato parziale verrà salvato nello storico. Continuare?',()=>finishTest('stop'))}
async function fullscreen(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch(e){showToast('Schermo intero non disponibile su questo dispositivo')}}
async function recover(){
  const s=await dbGet('kv','activeSession');
  if(!s)return;
  if(s.finished){
    await dbDelete('kv','activeSession');
    return;
  }
  if(s.endAt<=Date.now()){
    s.finished=true;s.finishReason='auto';s.completedAt=Date.now();
    await saveHistoryRecord(buildHistoryRecord(s));
    await dbDelete('kv','activeSession');
    return;
  }
  activeSession=s;
  $('settingsScreen').classList.add('hidden');$('testScreen').classList.remove('hidden');
  buildLive();$('testMeta').textContent=(s.className?s.className+' · ':'')+s.circuit+' m';
  updateTimer();timerHandle=setInterval(updateTimer,200);showToast('Prova in corso ripristinata');
}
$('startBtn').onclick=startTest;$('historyBtn').onclick=showHistory;$('clearBtn').onclick=()=>{document.querySelectorAll('#studentInputs input').forEach(x=>x.value='')};$('menuBtn').onclick=toggleMenu;$('fullscreenBtn').onclick=()=>{closeMenu();fullscreen()};$('restartBtn').onclick=restartTest;$('settingsFromTest').onclick=()=>{closeMenu();returnToSettings()};$('stopBtn').onclick=()=>{closeMenu();stopTest()};document.addEventListener('pointerdown',e=>{if(menuOpen&&!e.target.closest('.menu-wrap'))closeMenu()});
(async()=>{await openDB();renderInputs(defaultNames);const settings=await dbGet('kv','settings');if(settings){$('className').value=settings.className||'';$('duration').value=settings.duration||6;$('circuit').value=settings.circuit||200;renderInputs(settings.names||defaultNames)};document.querySelectorAll('#studentInputs input').forEach(i=>i.addEventListener('input',async()=>{const names=[...document.querySelectorAll('#studentInputs input')].map(x=>({name:x.value}));await dbPut('kv','settings',{className:$('className').value,duration:$('duration').value,circuit:$('circuit').value,names})}));$('className').addEventListener('input',saveSettings);$('duration').addEventListener('change',saveSettings);$('circuit').addEventListener('input',saveSettings);await recover()})();
async function saveSettings(){const names=[...document.querySelectorAll('#studentInputs input')].map(x=>({name:x.value}));await dbPut('kv','settings',{className:$('className').value,duration:$('duration').value,circuit:$('circuit').value,names})}
window.addEventListener('beforeunload',()=>{if(activeSession&&!activeSession.finished)queueSave()});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
